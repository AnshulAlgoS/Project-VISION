services:
  - type: web
    name: project-vision-api
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: VISION_DB_PATH
        value: /app/data/vision.db
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: vision-data
      mountPath: /app/data
      sizeGB: 1
